org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

org.gradle.daemon=false

# 32-bit dropped 2026-11-19: the only 32-bit phones new enough for
# minSdk 24 are 2017-2021 budget devices, a shrinking tail. This is
# the single switch for every build (CI split, release fat, local
# rebuild.sh): the Flutter Gradle plugin reads it for the AOT bundle,
# the native libs, and the split APKs. Do not add --target-platform
# to individual build commands or the two sources will drift.
target-platform=android-arm64,android-x64
