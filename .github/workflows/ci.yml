# CI — signed size-optimized build on every push to main.
#
# What it does: analyze, test, then build a SIGNED release APK split
# per ABI (arm64-v8a / x86_64), hash-stamp each APK and
# upload both (+ .sha256 files) as a workflow artifact. It never
# creates a tag or a GitHub Release — the manual "Release APK" workflow
# stays the only path to a published release (and may one day just
# promote one of these artifacts instead of rebuilding).
#
# Why signed: the APKs carry the real release key, so any commit's build
# installs as an update over the app on your phone — no uninstall, no
# lost local data. A debug build could not do that (different key).
#
# Why split: the fat APK ships one copy of the engine + Dart snapshot
# per ABI. Each split APK carries one ABI only — roughly 20 MB each,
# about half the fat download. (32-bit armeabi-v7a was dropped
# 2026-11-19 via target-platform in android/gradle.properties.)
#
# Triggers: push to main only, plus manual dispatch. No pull_request:
# PRs from forks cannot read the keystore secrets, so the restore step
# would fail there. Pushes to main are the only runs that can sign.
#
# Versioning: versionName stays as pubspec.yaml has it (0.1.0);
# versionCode is the commit count (`git rev-list --count HEAD`), which
# only ever goes up. That is the SAME scheme the release workflow uses,
# so a CI build and a later release install over each other in either
# direction — Android blocks an install whose versionCode is lower than
# the installed one. (Split APKs add 1000 x the ABI code on top of this
# base automatically; that offset is per-ABI, so monotonicity within
# one ABI is preserved.)
#
# Secrets (already set for the release workflow):
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS
# Artifacts expire after 90 days; the release workflow publishes the
# keepers as GitHub Releases, which do not expire.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Commit count (versionCode) needs full history, not a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set (see workflow header)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          chmod 600 android/key.properties android/app/release.keystore

      - name: Stamp version from commit count
        run: |
          python3 - <<'EOF'
          import re, subprocess
          count = subprocess.check_output(['git', 'rev-list', '--count', 'HEAD'], text=True).strip()
          p = 'pubspec.yaml'
          s = open(p).read()
          s2 = re.sub(r'(?m)^version:\s*(\S+)\+(\d+)\s*$', r'version: \1+' + count, s)
          assert s2 != s, 'version line not found in pubspec.yaml'
          open(p, 'w').write(s2)
          print('version now:', [l for l in s2.splitlines() if l.startswith('version:')][0])
          EOF

      - name: Build signed split APKs
        run: flutter build apk --release --split-per-abi --dart-define=BUILD_TAG=${GITHUB_SHA:0:7}

      - name: Hash-stamp the APKs
        run: |
          cd build/app/outputs/flutter-apk
          for apk in app-*-release.apk; do
            abi=${apk#app-}; abi=${abi%-release.apk}
            SHA=$(sha256sum "$apk" | cut -d' ' -f1)
            SHORT=${SHA:0:8}
            NEW="gw2-ptp-${abi}-${SHORT}.apk"
            mv "$apk" "$NEW"
            echo "${SHA}  ${NEW}" > "${NEW}.sha256"
            echo "Built $NEW ($(du -h "$NEW" | cut -f1), SHA-256 ${SHA})"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gw2-ptp-apks
          path: |
            build/app/outputs/flutter-apk/gw2-ptp-*.apk
            build/app/outputs/flutter-apk/gw2-ptp-*.apk.sha256
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### Signed split APKs for ${GITHUB_SHA:0:7}"
            echo ""
            echo "Install the APK matching your phone (arm64-v8a on nearly every modern phone)."
            echo ""
            for f in build/app/outputs/flutter-apk/gw2-ptp-*.apk; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
