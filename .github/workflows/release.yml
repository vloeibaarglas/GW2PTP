# Release APK — manual trigger only.
#
# This workflow NEVER runs on push/PR ("leave it off for automated builds").
# Trigger it by hand from the Actions tab for a release (e.g. v0.1):
# it lints, tests, bumps the versionCode from the run number, builds the
# release APK, and uploads it as an artifact with a hash-stamped filename
# (gw2-ptp-<sha8>.apk) plus a .sha256 file. The versionCode bump guarantees
# every release installs as an update over the previous one (Android
# requires a strictly increasing versionCode); the versionName in
# pubspec.yaml stays manual.
#
# Signing: release builds are signed with the release key. The workflow
# restores the keystore to android/app/release.keystore (Gradle resolves
# storeFile relative to the app module) and writes android/key.properties.
# That key is the identity of every installed build — same key
# => the APK installs as an update. Required secrets:
#   ANDROID_KEYSTORE_BASE64  — base64 of the release keystore file
#   ANDROID_KEYSTORE_PASSWORD — keystore + key password
#   ANDROID_KEY_ALIAS        — key alias (gw2ptp)
# Do not lose the keystore or its password.

name: Release APK

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g. v0.1)'
        required: false
        default: 'manual'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set (see workflow header)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          chmod 600 android/key.properties android/app/release.keystore

      - name: Bump versionCode from run number
        run: |
          python3 - <<'EOF'
          import re
          p = 'pubspec.yaml'
          s = open(p).read()
          s2 = re.sub(r'(?m)^version:\s*(\S+)\+(\d+)\s*$',
                      r'version: \1+${{ github.run_number }}', s)
          assert s2 != s, 'version line not found in pubspec.yaml'
          open(p, 'w').write(s2)
          print('version now:', [l for l in s2.splitlines() if l.startswith('version:')][0])
          EOF

      - name: Build release APK
        run: flutter build apk --release --dart-define=BUILD_TAG=${GITHUB_SHA:0:7}

      - name: Hash-stamp the APK
        run: |
          cd build/app/outputs/flutter-apk
          SHA=$(sha256sum app-release.apk | cut -d' ' -f1)
          SHORT=${SHA:0:8}
          mv app-release.apk "gw2-ptp-${SHORT}.apk"
          echo "${SHA}  gw2-ptp-${SHORT}.apk" > "gw2-ptp-${SHORT}.apk.sha256"
          echo "APK=gw2-ptp-${SHORT}.apk" >> "$GITHUB_ENV"
          echo "SHA256=${SHA}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: |
            build/app/outputs/flutter-apk/${{ env.APK }}
            build/app/outputs/flutter-apk/${{ env.APK }}.sha256

      - name: Summary
        run: |
          echo "### ${{ inputs.release_name }} built" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`${{ env.APK }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`${{ env.SHA256 }}\`" >> "$GITHUB_STEP_SUMMARY"
